<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f9f9f9;color:#202020;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
    <div style="padding:40px 16px;">
      <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e8e8e8;border-radius:14px;padding:32px;">
        <div style="font-size:18px;font-weight:600;">Saathi</div>
        <h1 style="margin:24px 0 0;font-size:24px;line-height:1.2;font-weight:600;">Your sign-in link</h1>
        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#646464;">Open this link to sign in. It works once and expires in an hour.</p>
        <p style="margin:28px 0;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#5753c6;color:#ffffff;font-size:15px;font-weight:500;text-decoration:none;">Sign in to Saathi</a></p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#707070;">If you didn't ask for this, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
